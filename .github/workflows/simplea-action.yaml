name: Simp[le Action
on: [push]
jobs:
    simple-action:
        runs-on: ubuntu-latest
        steps:
            - name: Simple JS Action
              id: greet
              uses: actions/hello-world-javascript-action@main
              with:
                who-to-greet: 'Mona the Octocat'
            - name: Log Greeting Time
              run: echo "Greeting time was ${{ steps.greet.outputs.time }}"