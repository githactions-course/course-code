name: Working Dirs and Shells
on: [push]
jobs:
    dispaly-wd-info:
        runs-on: ubuntu-latest
        steps:
            - name: Display Working Directory & List files
              run: |
                pwd
                ls -a
                echo $GITHUB_SHA
                echo $GITHUB_REPOSITORY
                echo $GITHUB_WORKSPACE
    dispaly-wd-info-windows:
        runs-on: windows-latest
        steps:
            - name: Display Working Directory & List files
              run: |
                pwd
                ls -a
                echo $GITHUB_SHA
                echo $GITHUB_REPOSITORY
                echo $GITHUB_WORKSPACE