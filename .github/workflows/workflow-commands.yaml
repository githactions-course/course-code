name: Workflow Commands
on : [push]

jobs:
    testing-wf-commands:
        runs-on: ubuntu-latest
        steps:
            - name: Setting an error message
              run: echo "::error::Missing semicolon"
            - name: Setting an error message with params
              run: echo "::error title:Error titlefile=app.js,line=2,endline=3,col=5,nedColumn=7::Missing Semicolon"
            - name: Setting a debug message with params
              run: echo "::debug title:Debug titlefile=app.js,line=2,endline=3,col=5,nedColumn=7::Missing Semicolon"
            - name: Setting a warning message with params
              run: echo "::warning title:Warning titlefile=app.js,line=2,endline=3,col=5,nedColumn=7::Missing Semicolon"
            - name: Setting a notice message with params
              run: echo "::notice title:Notice titlefile=app.js,line=2,endline=3,col=5,nedColumn=7::Missing Semicolon"
            - name: Group of logs
              run: |
                  echo "::group::My group title"
                  echo "Inside group"
                  echo "::endgroup::"
            - name: Masking a value
              run: echo "::add-mask::Secret String"
            - name: Echo a secret
              run: echo "Secret String"